<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RioNext v3 战役工作台</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a202c;--dim:#718096;--line:#e4e7ec;--acc:#2b6cb0;--acc2:#2c5282;--ok:#38a169;--warn:#d69e2e;--bad:#e53e3e;--sans:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;border:0;cursor:pointer;border-radius:6px;padding:7px 14px;background:var(--acc);color:#fff}
button:hover{filter:brightness(1.06)}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--bad)}
button.sm{padding:3px 10px;font-size:12px;border-radius:5px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
label.f{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
aside{background:#1f2733;color:#c6cfda;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{padding:6px 10px 16px;font-weight:700;color:#fff;font-size:15px}
aside .brand em{font-style:normal;color:#63b3ed}
aside nav a{display:flex;justify-content:space-between;align-items:center;color:#c6cfda;text-decoration:none;padding:8px 10px;border-radius:6px;margin:2px 0;cursor:pointer}
aside nav a:hover{background:#2a3547}
aside nav a.on{background:#2b6cb0;color:#fff}
aside nav .cnt{background:#4a5568;color:#fff;border-radius:9px;font-size:11px;padding:0 7px}
aside .foot{margin-top:18px;padding:10px;font-size:11px;color:#718096;border-top:1px solid #2a3547}
main{padding:0 0 60px}
.top{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 22px;position:sticky;top:0;z-index:5}
.top .crumb{color:var(--dim);font-size:13px}
.top .spacer{flex:1}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;font-size:12px;padding:2px 10px;color:var(--dim)}
.chip b{color:var(--ink);font-weight:600}
.page{padding:20px 22px;max-width:1280px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:13px;color:var(--dim);text-transform:none;margin-bottom:10px;font-weight:600}
.card .big{font-size:26px;font-weight:700}
.card .sub{font-size:12px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:11px;padding:1px 9px;font-weight:600}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-active{color:#2f855a;background:#f0fff4}
.p-awaiting_verify{color:#b7791f;background:#fffff0}
.p-budget_paused{color:#2b6cb0;background:#ebf8ff}
.p-blocked,.p-cancelled{color:#c53030;background:#fff5f5}
.p-cancelled{text-decoration:line-through}
.p-completed{color:#276749;background:#f0fff4}
.p-paused,.p-waiting,.p-plateau,.p-created,.p-closing{color:#4a5568;background:#edf2f7}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover{background:#f7fafc}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--dim)}
.progress{height:7px;border-radius:4px;background:#edf2f7;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--acc)}
.progress i.warn{background:var(--warn)}
.progress i.bad{background:var(--bad)}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:240px;flex:1;background:#edf2f7;border-radius:10px;padding:10px}
.kcol h4{font-size:12px;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.kcard:hover{border-color:var(--acc)}
.kcard .t{font-weight:600;font-size:13px}
.kcard .m{font-size:11px;color:var(--dim);margin-top:3px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--dim);background:#f7fafc}
.tag.warn{color:#b7791f;border-color:#f6e05e;background:#fffff0}
.tag.bad{color:#c53030;border-color:#feb2b2;background:#fff5f5}
.tag.ok{color:#276749;border-color:#9ae6b4;background:#f0fff4}
.banner{display:flex;align-items:center;gap:12px;background:#fffff0;border:1px solid #f6e05e;border-radius:10px;padding:12px 16px;margin-bottom:16px}
.banner.warn2{background:#fff5f5;border-color:#feb2b2}
.banner.blue{background:#ebf8ff;border-color:#90cdf4}
.banner .t{font-weight:600}
.banner .code{font-family:var(--mono);font-size:13px;color:#744210;word-break:break-all}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px}
.tabs .t{padding:8px 14px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;font-size:13px}
.tabs .t.on{color:var(--acc2);border-color:var(--acc2);font-weight:600}
.modal-mask{position:fixed;inset:0;background:#1a202c66;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:5vh 20px}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:12px;width:720px;max-width:100%;padding:20px 24px;box-shadow:0 12px 40px #0003}
.modal h2{font-size:16px;margin-bottom:6px}
.modal .close{float:right;cursor:pointer;color:var(--dim);font-size:18px}
.steps-ind{display:flex;gap:6px;margin-bottom:14px}
.steps-ind span{flex:1;text-align:center;font-size:12px;color:var(--dim);padding-bottom:6px;border-bottom:3px solid var(--line)}
.steps-ind span.on{color:var(--acc2);border-color:var(--acc2);font-weight:600}
pre{white-space:pre-wrap;word-break:break-all;background:#1a202c;color:#e2e8f0;border-radius:8px;padding:12px;font-size:12px;font-family:var(--mono);max-height:320px;overflow:auto}
.toast{position:fixed;bottom:18px;right:18px;z-index:99;display:none;max-width:620px;background:#1a202c;color:#e2e8f0;border-radius:10px;box-shadow:0 10px 30px #0004}
.toast .cap{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;color:#a0aec0;border-bottom:1px solid #2d3748}
.toast pre{background:transparent;border-radius:0;max-height:180px}
.slot{display:flex;justify-content:space-between;align-items:center;border:1px dashed #cbd5e0;border-radius:8px;padding:8px 12px;margin-bottom:8px;background:#f7fafc}
.slot select{width:220px}
.kali{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.logbox{background:#1a202c;color:#a0aec0;border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;height:180px;overflow:auto}
.logbox .ok{color:#68d391}
.logbox .err{color:#fc8181}
.donut{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--acc) 0deg,#edf2f7 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.donut b{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:12px}
.evi{font-size:12px;color:#4a5568;padding:3px 0 3px 10px;border-left:3px solid #cbd5e0;margin:4px 0}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.ccard:hover{border-color:var(--acc);box-shadow:0 2px 10px #0000000d}
.ccard .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .id{font-weight:600;font-size:13px}
.ccard .meta{font-size:12px;color:var(--dim);margin-top:4px}
.switch{position:relative;display:inline-block;width:40px;height:22px}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:#cbd5e0;border-radius:11px;cursor:pointer;transition:.15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+i{background:var(--acc)}
.switch input:checked+i::after{left:21px}
</style>

  <div class="grid g2">

    <select id="wz-kind" onchange="wzTriage();wzSnap()"><option>auto</option><option>reverse</option><option>pwn</option><option>misc</option><option>crypto</option><option>generic</option></select></div>
   <div><label class="f">--endpoint tcp://host:port（可空）</label><input id="wz-ep" placeholder="tcp://10.20.30.40:9999"></div>

const TRI={apk:{kind:"reverse",ov:"apk",conf:"high",seed:"apk-reverse"},elf:{kind:"reverse",ov:null,conf:"high",seed:"reverse-native"},pcapng:{kind:"misc",ov:"protocol",conf:"high",seed:"protocol-pcap"},png:{kind:"misc",ov:"stego",conf:"high",seed:"ctf-misc"}};
function wzTriage(){
 const p=$("wz-input").value,t=TRI[p.split(".").pop()]||TRI.png;
 $("wz-tri").innerHTML=`<div class="evi"><b>triage 预览</b>（本地确定性：magic bytes / zip 成员 / PE .NET / ELF；证据弱时给 generic，不猜）</div>
 <div class="flex"><span class="tag">题型 ${t.kind}${t.ov?"/"+t.ov:""}</span><span class="tag">置信度 ${t.conf}</span><span class="tag">seed ${t.seed}</span><span class="tag">skill ${t.seed}.txt</span></div>
 <div class="sub mt" style="color:var(--dim)">暂存后 workspace：input/original 只读 · input/manifest.json（sha256/format/executable）· work/ · artifacts/。同输入重跑续同 id。</div>`;
}
function wzSnap(){
 if(!$("wz-url")&&!$("wz-input")&&!$("wz-spec"))return;
 wz.url=$("wz-url")?$("wz-url").value:null;
 wz.input=$("wz-input")?$("wz-input").value:null;
 wz.spec=$("wz-spec")?$("wz-spec").value.split("（")[0]:null;
 wz.kind=$("wz-kind")?$("wz-kind").value:"auto";
 wz.ep=$("wz-ep")?$("wz-ep").value:"";
 wz.hint=$("wz-hint")?$("wz-hint").value:"";
 const t=wz.input?TRI[wz.input.split(".").pop()]||TRI.png:null;
 wz.triage=t;
}

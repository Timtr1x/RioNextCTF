button{font:inherit;background:var(--amber);color:#1c1408;border:0;padding:6px 10px;cursor:pointer;border-radius:2px}
button.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--amber)}
button.sm{padding:2px 7px;font-size:11px}
button.warn{background:transparent;color:var(--bad);border:1px solid #5c2a2a}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;background:var(--bg3);color:var(--paper);border:1px solid #4a4336;padding:6px 8px;border-radius:2px;width:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
header .logo{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber2)}
header .sub{color:var(--dim);font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);padding:2px 8px;border-radius:2px;font-size:11px;color:var(--dim);background:var(--bg3)}
.lamp{width:7px;height:7px;border-radius:50%;background:#4a4336;display:inline-block}
.lamp.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.lamp.bad{background:var(--bad)}
.lamp.warn{background:var(--amber2)}
header .spacer{flex:1}
main{display:grid;grid-template-columns:270px 1fr 330px;gap:0;min-height:calc(100vh - 42px)}
.col{border-right:1px solid var(--line);min-width:0}
.col.right{border-right:0}
.col-head{padding:8px 12px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.col-head .act{color:var(--dim);cursor:pointer;text-transform:none;letter-spacing:0}
.col-head .act:hover{color:var(--amber2)}
.pad{padding:10px 12px}
.camp-item{padding:8px 12px;border-bottom:1px solid #262218;cursor:pointer}
.camp-item:hover{background:var(--bg2)}
.camp-item.sel{background:#241f15;border-left:2px solid var(--amber)}
.camp-item .id{font-size:12px}
.camp-item .row2{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--dim);margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:0 6px;border:1px solid var(--line);border-radius:2px;color:var(--dim)}
.badge.s-active{color:var(--ok);border-color:#2c4a36}
.badge.s-awaiting_verify{color:var(--amber2);border-color:#5a3c12}
.badge.s-budget_paused{color:var(--blue);border-color:#1f4252}
.badge.s-blocked{color:var(--bad);border-color:#5c2a2a}
.badge.s-completed{color:var(--ok);border-color:#2c4a36;background:#1a231b}
.badge.s-cancelled{color:#8a8171;text-decoration:line-through}
.badge.s-plateau,.badge.s-waiting,.badge.s-paused,.badge.s-created,.badge.s-closing{color:var(--dim)}
.pending-dot{width:8px;height:8px;border-radius:50%;background:var(--amber2);box-shadow:0 0 6px var(--amber2);display:inline-block;margin-left:4px}
.barm{height:3px;background:#2a2519;margin-top:5px;border-radius:2px;overflow:hidden;display:flex}
.barm i{background:var(--amber);height:100%}
.barm i.t{background:var(--blue)}
.card{background:var(--bg2);border:1px solid var(--line);padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.kv .k{color:var(--dim)}
.gauge{margin:6px 0}
.gauge .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.gauge .bar{height:8px;background:var(--bg3);border:1px solid var(--line);margin-top:3px;border-radius:2px;overflow:hidden;display:flex}
.gauge .bar i{height:100%}
.i-spend{background:var(--amber)}
.i-res{background:#5b4a1e}
.i-over{background:var(--bad)}
.pct-row{display:flex;gap:10px;align-items:baseline;margin:4px 0}

.pct-row .d{font-size:10px;color:var(--dim)}
.stream{overflow-y:auto}
.inv{padding:5px 12px;border-bottom:1px solid #221e16;font-size:12px}
.inv .top{display:flex;gap:8px;align-items:center}
.inv .t{color:var(--dim);font-size:10px}
.inv .kind-m{color:var(--blue)}
.inv .kind-t{color:var(--ok)}
.inv .purpose{color:var(--paper)}
.inv .state{margin-left:auto;font-size:10px}
.inv .st-completed{color:var(--dim)}
.inv .st-running{color:var(--ok)}
.inv .st-uncertain,.inv .st-failed_known{color:var(--bad)}
.inv .meta{font-size:10px;color:var(--dim);padding-left:2px}
.tag{font-size:10px;border:1px solid var(--line);padding:0 5px;border-radius:2px;color:var(--dim)}
.tag.trunc{color:var(--amber2);border-color:#5a3c12}
.tag.err{color:var(--bad);border-color:#5c2a2a}
.toolbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg2)}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--bg2)}
.tabbar .tab{padding:7px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer;border-right:1px solid var(--line)}
.tabbar .tab.on{color:var(--amber2);background:var(--bg);border-top:2px solid var(--amber)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:400}
td{padding:5px 10px;border-bottom:1px solid #221e16;vertical-align:top}
td .mut{color:var(--dim)}
tr.click{cursor:pointer}
tr.click:hover{background:var(--bg2)}
.jack{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px dashed #4a4336;padding:5px 8px;font-size:11px;margin-bottom:6px}
.jack select{width:150px}
.modal-mask{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 20px}
.modal-mask.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);width:760px;max-width:100%;padding:16px 20px}
.modal h2{margin:0 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber2)}
.modal .close{float:right;cursor:pointer;color:var(--dim)}
.modal .close:hover{color:var(--bad)}

.frow label{color:var(--dim);font-size:11px}

   <div class="mini mt">execution_id ${o.execution_id} · 起于 ${o.started}${o.next_poll?" · 下次轮询 "+o.next_poll:""}${o.lock?" · 占用 "+o.lock:""}${o.collected?" · "+o.collected:""}</div>
   ${o.state==="running"?`<div class="flex mt"><button class="ghost sm" onclick="toast('rionext status ${c.id} --json','查看 operations 与 next_poll')">查看状态</button><button class="warn sm" onclick="toast('rionext cancel ${c.id}','cancel 停容器并杀后台扫描，已发包不收回')">终止战役容器</button></div>`:""}
   </div>`).join("")||'<div class="mini">（无后台操作）</div>'}
  <div class="mini">扫描器（nmap/nuclei/katana…）立即返回 execution_id，在容器里继续跑最长 60 分钟，占用 workspace 排它锁。</div></div>`;
 }else if(centerTab==="verify"){
  tb.innerHTML=`<div class="pad">${renderVerifyCard(true)}</div>`;
 }
 renderBottom();
}

function renderVerifyCard(force){
 const c=C();const p=c.pending;
 if(!p)return force?'<div class="mini">当前没有待审 flag。</div>':"";
 return `<div class="card" style="border-color:#5a3c12">
  <h3>待人审 flag · fact_key=${p.fact_key}</h3>
  <div style="font-size:15px;color:var(--amber2);word-break:break-all">${esc(p.proposition)}</div>
  <div class="mini mt">fact ${p.id} · 依据 obs_388 · 战役停在 awaiting_verify，accept 才关战役</div>
  <div class="flex mt">
   <button onclick="verifyAccept()">接受 · 关战役</button>
   <button class="warn" onclick="verifyReject()">驳回 · 带原因继续</button>
  </div></div>`;
}
function verifyAccept(){const c=C();toast("rionext accept "+c.id,"CLI 等价命令 · accept 后 root_goal 置 verified，closing→completed");c.state="completed";c.pending=null;renderAll()}
function verifyReject(){const c=C();openModal(`<h2>驳回 flag</h2><div class="mini">原因会写进上下文（hint），战役回到 active。勾选 --continue 则立刻再 start。</div>
 <textarea id="rj-text" rows="3" placeholder="这个 flag 不对，因为……"></textarea>
 <label class="mini" style="display:block;margin:8px 0"><input type="checkbox" id="rj-cont" checked style="width:auto"> 驳回后立即继续（--continue）</label>
 <button class="warn" onclick="toast('rionext reject ${c.id} --text \"'+document.getElementById('rj-text').value+'\"'+(document.getElementById('rj-cont').checked?' --continue':''));closeModal()">提交驳回</button>`)}

/* ---------- 底部 tabs ---------- */
function renderBottom(){
 const c=C();const el=document.getElementById("tab-body");
 if(bottomTab==="steps"){
  el.innerHTML=`<table><tr><th>step</th><th>状态</th><th>kind</th><th>method family</th><th>尝试</th><th>blocked 原因</th><th>reopen</th></tr>
  ${c.steps.map(s=>`<tr class="click" onclick="toast('rionext explain-step ${c.id} --step ${s.id}')"><td>${esc(s.id)}</td><td><span class="badge s-${s.st==="resolved"?"completed":s.st}">${s.st}</span></td><td>${s.kind}</td><td>${s.mf}</td><td>${s.att}</td><td class="mut">${esc(s.why||"-")}</td><td class="mut">${esc(s.reopen||"-")}</td></tr>`).join("")}</table>`;
 }else if(bottomTab==="facts"){
  el.innerHTML=`<table><tr><th>fact</th><th>命题</th><th>fact_key</th><th>认知状态</th><th>grade</th><th>validity</th><th>依据</th></tr>
  ${c.facts.map(f=>`<tr class="click" onclick="showFact('${f.id}')"><td>${esc(f.id)}</td><td>${esc(f.proposition)}</td><td class="mut">${esc(f.key||"-")}</td>
  <td>${f.st==="pending"?'<span class="tag trunc">pending 人审</span>':`<span class="tag">${f.st}</span>`}</td><td>${f.grade}</td><td>${f.validity}</td><td class="mut">${(f.refs||[]).join(" ")||"-"}</td></tr>`).join("")}</table>`;
 }else if(bottomTab==="findings"){
  el.innerHTML=`<table><tr><th>finding</th><th>claim</th><th>状态</th><th>dedup_key</th><th>impact</th></tr>
  ${c.findings.map(f=>`<tr><td>${esc(f.id)}</td><td>${esc(f.claim)}</td><td><span class="tag ${f.st==="confirmed"?"":"trunc"}">${f.st}</span></td><td class="mut">${f.dedup}</td><td>${esc(f.impact||"")}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">（无 finding）</td></tr>'}</table>`;
 }else if(bottomTab==="observations"){
  el.innerHTML=`<table><tr><th>obs</th><th>subject</th><th>时间</th><th>producing step</th><th>摘要</th></tr>
  ${c.observations.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.subject)}</td><td class="mut">${o.at}</td><td class="mut">${esc(o.by)}</td><td>${esc(o.sum)}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">（无观察）</td></tr>'}</table>`;
 }else if(bottomTab==="coverage"){
  el.innerHTML=`<table><tr><th>obligation</th><th>维度</th><th>applicability</th><th>execution</th><th>outcome</th><th>evidence</th><th>mandatory</th></tr>
  ${c.coverage.map(cv=>`<tr><td>${esc(cv.obligation)}</td><td>${cv.dim}</td><td>${cv.app}</td><td><span class="tag ${cv.exec==="tested"?"":"trunc"}">${cv.exec}</span></td><td>${cv.outcome}</td><td>${cv.evi}</td><td>${cv.mandatory?"必查":""}</td></tr>`).join("")||'<tr><td colspan="7" class="mut">（goal_seeking 战役通常不铺 coverage）</td></tr>'}</table>`;
 }else if(bottomTab==="events"){
  el.innerHTML=`<table><tr><th>seq</th><th>type</th><th>actor</th><th>时间</th><th>payload</th></tr>
  ${c.events.map(e=>`<tr><td class="mut">${e.seq}</td><td>${esc(e.type)}</td><td class="mut">${esc(e.actor)}</td><td class="mut">${e.at}</td><td>${esc(e.pay)}</td></tr>`).join("")}</table>`;
 }else if(bottomTab==="artifacts"){
  el.innerHTML=`<table><tr><th>artifact</th><th>mime</th><th>size</th><th>截断</th><th>说明</th></tr>
  ${c.artifacts.map(a=>`<tr class="click" onclick="toast('rionext ……（artifact_read 是模型工具；CLI 用 rionext status 看引用）')"><td>${esc(a.id)}</td><td>${a.mime}</td><td>${a.size.toLocaleString()} B</td><td>${a.trunc?'<span class="tag trunc">是</span>':"否"}</td><td class="mut">${esc(a.note)}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">（无产物）</td></tr>'}</table>`;
 }else if(bottomTab==="report"){
  const fin=c.fin,pr=fin.execute_runs_total?(fin.finish_primary_total/fin.execute_runs_total*100).toFixed(1)+"%":"n/a",fs=fin.finalizer_started_total?(fin.finalizer_committed_total/fin.finalizer_started_total*100).toFixed(1)+"%":"n/a";
  const pc=fin.execute_runs_total?((fin.finish_primary_total+fin.finalizer_committed_total)/fin.execute_runs_total*100).toFixed(1)+"%":"n/a";
  el.innerHTML=`<div class="pad">
   <div class="mini">rionext report ${c.id} · 快照 seq ${c.events.length?c.events[c.events.length-1].seq:0} · bounded_conclusion：</div>
   <pre>In scope s-quick-1, env env-1: ${c.state==="completed"?"recovered sample":"未恢复 flag"}. No statement that the world is safe.</pre>
   <div class="flex">
    <div class="card" style="flex:1"><h3>收卷统计</h3>
     <div class="pct-row"><span class="n">${pr}</span><span class="d">主动交卷率 ${fin.finish_primary_total}/${fin.execute_runs_total}</span></div>
     <div class="pct-row"><span class="n">${fs}</span><span class="d">补交成功率 ${fin.finalizer_committed_total}/${fin.finalizer_started_total}</span></div>
     <div class="pct-row"><span class="n">${pc}</span><span class="d">最终协议完整率</span></div>
     <div class="mini mt">validation_error ${fin.finish_validation_error_total} · conflict ${fin.finish_conflict_total} · incomplete_protocol ${fin.incomplete_protocol_total}</div></div>
    <div class="card" style="flex:1"><h3>报告要点</h3>
     <div class="kv"><span class="k">findings</span><span>${c.findings.length} 条（${c.findings.filter(f=>f.st==="confirmed").length} confirmed）</span></div>
     <div class="kv"><span class="k">unresolved</span><span>${c.steps.filter(s=>!["resolved","retired"].includes(s.st)).length} 个 step 未收</span></div>
     <div class="kv"><span class="k">stop_reason</span><span>${c.state}</span></div>
     <div class="kv"><span class="k">unknown_cost</span><span>${c.budget.cost.spent==null?"true（price_version=unknown）":"false"}</span></div></div>
   </div></div>`;
 }
}
function showFact(id){const c=C();const f=c.facts.find(x=>x.id===id);if(!f)return;
 openModal(`<h2>fact · ${esc(f.id)}</h2>
 <div class="kv"><span class="k">命题</span><span>${esc(f.proposition)}</span></div>
 <div class="kv"><span class="k">fact_key</span><span>${esc(f.key||"-")}</span></div>
 <div class="kv"><span class="k">状态</span><span>${f.st}${f.note?" · "+esc(f.note):""}</span></div>
 <div class="kv"><span class="k">依据</span><span>${(f.refs||[]).join(" ")||"-"}</span></div>
 ${f.st==="pending"?`<div class="flex mt"><button onclick="closeModal();verifyAccept()">accept</button><button class="warn" onclick="closeModal();verifyReject()">reject</button></div>`:""}
 <button class="ghost sm mt" onclick="toast('rionext facts ${c.id} --json')">rionext facts 全量</button>`)}

/* ---------- 右栏 ---------- */
function renderRight(){
 const c=C();const b=c.budget;
 const gauge=(l,o,fmt)=>{const p=o.total?Math.min(100,Math.round(o.spent/o.total*100)):0;
  return `<div class="gauge"><div class="lbl"><span>${l}</span><span>${fmt}</span></div>
  <div class="bar"><i class="i-spend" style="width:${p}%"></i>${o.reserved?`<i class="i-res" style="width:${o.total?Math.round(o.reserved/o.total*100):0}%"></i>`:""}</div></div>`};
 document.getElementById("right-stack").innerHTML=`
  <div class="card"><h3>预算 ${c.id==="camp_kali_lab"?'<span class="tag err">已触顶 budget_paused</span>':""}</h3>
   ${gauge("calls",{spent:b.calls.spent,total:b.calls.total,reserved:b.calls.reserved},`${b.calls.spent.toLocaleString()} / ${b.calls.total.toLocaleString()}`)}
   ${gauge("tokens",{spent:b.tokens.spent,total:b.tokens.total,reserved:b.tokens.reserved},`${(b.tokens.spent/1e6).toFixed(1)}M / ${b.tokens.total/1e6}M`)}
   <div class="kv"><span class="k">cost</span><span>${b.cost.spent==null?"unknown（"+b.cost.note+"）":b.cost.spent}</span></div>
   <div class="kv"><span class="k">deadline</span><span>${b.deadline?b.deadline:"无"}</span></div>
   <div class="mini mt">模型发送和工具调用各记 1 次 call；reserved 是本片段预留。</div></div>
  <div class="card"><h3>Execute 收卷</h3>
   <div class="pct-row"><span class="n">${c.fin.execute_runs_total?Math.round(c.fin.finish_primary_total/c.fin.execute_runs_total*100):0}%</span><span class="d">主动交卷 ${c.fin.finish_primary_total}/${c.fin.execute_runs_total}</span></div>
   <div class="pct-row"><span class="n">${c.fin.finalizer_started_total?Math.round(c.fin.finalizer_committed_total/c.fin.finalizer_started_total*100):0}%</span><span class="d">补交成功 ${c.fin.finalizer_committed_total}/${c.fin.finalizer_started_total}</span></div>
   <div class="pct-row"><span class="n">${c.fin.execute_runs_total?Math.round((c.fin.finish_primary_total+c.fin.finalizer_committed_total)/c.fin.execute_runs_total*100):0}%</span><span class="d">协议完整率</span></div>
   <div class="mini mt">finalization 默认开：没交 finish_step 时补一轮，最多一次，thinking low。</div></div>
  ${renderVerifyCard()}
  <div class="card"><h3>uncertain / residual</h3>
   ${(c.uncertain||[]).length?c.uncertain.map(u=>`<div class="kv"><span class="k">${esc(u.id)} ${esc(u.purpose)}</span><span style="color:var(--bad)">${esc(u.err)}</span></div>`).join(""):'<div class="mini">无 uncertain 调用。</div>'}
   ${(c.residual||[]).length?c.residual.map(r=>`<div class="flex mt"><span class="mini">${r.execution_id} · 可终止</span><button class="warn sm" onclick="toast('rionext cancel ${c.id}','cancel 停容器，已发的包收不回来')">cancel 容器</button></div>`).join(""):""}
   <button class="ghost sm mt" onclick="openReconcile()">reconcile 核对</button></div>
  <div class="card"><h3>控制器与租约</h3>
   <div class="kv"><span class="k">锁</span><span>${c.lock?esc(c.lock):"空闲（无进程持有）"}</span></div>
   <div class="kv"><span class="k">active run</span><span>${c.active_run?c.active_run.mode+" "+c.active_run.id:"-"}</span></div>
   <div class="kv"><span class="k">ready / blocked</span><span>${c.steps.filter(s=>s.st==="ready").length} / ${c.steps.filter(s=>s.st==="blocked").length}</span></div>
   <div class="mini mt">同一战役不要再 start 第二个进程，锁会拒绝。</div></div>`;
}

function openWizard(){
 openModal(`<h2>新战役 · 三种入口</h2>
 <div class="tabs-sub">
  <span class="sub on" id="wz-t-url" onclick="wzTab('url')">--url 活靶 web</span>
  <span class="sub" id="wz-t-input" onclick="wzTab('input')">--input 附件（triage）</span>
  <span class="sub" id="wz-t-spec" onclick="wzTab('spec')">--spec 文件</span>
 </div>
 <div id="wz-body"></div>`);
 wzTab("url");
}
function wzTab(t){
 ["url","input","spec"].forEach(k=>document.getElementById("wz-t-"+k).classList.toggle("on",k===t));
 const b=document.getElementById("wz-body");
 if(t==="url"){
  b.innerHTML=`<div class="frow"><label>目标 URL</label><input id="wz-url" value="http://authorized-target.example/"></div>
  <div class="frow"><label>战役 id</label><input id="wz-id" placeholder="留空按 host 生成 camp_&lt;host&gt;"></div>
  <div class="frow"><label>thinking</label><select id="wz-th"><option>max</option><option>high</option><option>low</option></select></div>
  <div class="mini">solver 槽模型跑。成功条件固定 flag_recovered；scope 自动带 host 与入口 URL；出口按解析 IP 放行。</div>
  <div class="flex mt"><button onclick="wzUrl()">生成 spec（create 并 start）</button></div><div id="wz-prev"></div>`;
 }else if(t==="input"){
  b.innerHTML=`<div class="frow"><label>附件路径</label><select id="wz-file" onchange="wzTriage()">
   <option value="apk">D:\\ctf\\sysuser.apk（214 文件 / 41.2MB）</option>
   <option value="elf">D:\\ctf\\crackme.elf（1 文件 / 24KB）</option>
   <option value="pcap">D:\\ctf\\chall.pcapng（1 文件 / 3.1MB）</option>
   <option value="png">D:\\ctf\\stego.png（1 文件 / 2.2MB）</option></select></div>
  <div class="frow"><label>--kind</label><select id="wz-kind" onchange="wzTriage()"><option>auto（自动判定）</option><option>reverse</option><option>pwn</option><option>misc</option><option>crypto</option><option>generic</option></select></div>
  <div class="frow"><label>--endpoint</label><input id="wz-ep" placeholder="tcp://10.20.30.40:9999（可空）"></div>
  <div class="frow"><label>--hint</label><input id="wz-h" placeholder="登录逻辑在 native lib（可空）"></div>
  <div id="wz-prev"></div>`;
  wzTriage();
 }else{
  b.innerHTML=`<div class="frow"><label>spec 路径</label><select id="wz-spec"><option>profiles/demo-lab.json（scripted 合成）</option><option>profiles/kali-lab.json（assessment）</option></select></div>

  <div id="wz-prev"></div>`;
 }
}
function wzUrl(){
 const u=document.getElementById("wz-url").value,id=document.getElementById("wz-id").value,th=document.getElementById("wz-th").value;
 const host=u.replace(/^https?:\/\//i,"").split("/")[0];
 document.getElementById("wz-prev").innerHTML=`<pre>campaign_id  ${id||("camp_"+host.replace(/[^a-z0-9.]+/gi,"-"))}
mode        goal_seeking
root_goal   恢复 flag（success_predicate flag_recovered）
scope       assets=[${host}] entries=[${u}] profile=kali-lab
tool_allowlist  graph_query artifact_read submit_* propose_step finish_* checkpoint kali_run kali_write playwright
model_policy    ${PROVIDERS[1].display_name}/deepseek-v4-flash thinking=${th}
budget      3000 calls · 30,000,000 tokens（默认）
execution_profile  kali</pre>`;
 toast(`rionext run --url ${u}${id?" --id "+id:""}`);
}
const TRIAGE={
 apk:{kind:"reverse",overlay:"apk",conf:"high",seed:"apk-reverse",evi:[["container","sysuser.apk: apk 结构（AndroidManifest.xml + classes.dex）",3],["magic","sysuser.apk: zip (214 members)",2],["user","operator hint",1]]},
 elf:{kind:"reverse",overlay:null,conf:"high",seed:"reverse-native",evi:[["magic","crackme.elf: elf 64-bit x86-64 dynamic",3]]},
 pcap:{kind:"misc",overlay:"protocol",conf:"high",seed:"protocol-pcap",evi:[["magic","chall.pcapng: pcapng",3]]},
 png:{kind:"misc",overlay:"stego",conf:"high",seed:"ctf-misc",evi:[["magic","stego.png: png",3]]}};
const WZ_PATHS={apk:"D:\\ctf\\sysuser.apk",elf:"D:\\ctf\\crackme.elf",pcap:"D:\\ctf\\chall.pcapng",png:"D:\\ctf\\stego.png"};
function wzTriage(){
 const f=document.getElementById("wz-file").value,k=document.getElementById("wz-kind").value,tr=TRIAGE[f];
 const over=k!=="auto（自动判定）"&&k!==tr.kind;
 const kind=over?k:tr.kind,conf=over?"high（用户覆盖）":tr.conf,seed=over?{reverse:"reverse-native",pwn:"pwn-chain",misc:"ctf-misc",crypto:"ctf-crypto",generic:"ctf-triage"}[k]:tr.seed;
 document.getElementById("wz-prev").innerHTML=`<div class="card mt"><h3>triage 预览（本地确定性，不跑附件）</h3>
  <div class="flex"><span class="badge">题型 ${kind}${tr.overlay&&kind===tr.kind?"/"+tr.overlay:""}</span><span class="badge">置信度 ${conf}</span><span class="badge">seed ${seed}</span><span class="badge">skill prompts/skills/${seed}.txt</span></div>
  <div class="mini mt">证据：</div>${tr.evi.map(e=>`<div class="evi">${e[0]} · ${esc(e[1])}（权重 ${e[2]}）</div>`).join("")}
  <div class="mini mt">workspace 布局：input/original 只读 · input/manifest.json（sha256、format、executable）· work/ 草稿 · artifacts/ 证据</div></div>
  <button onclick="toast('rionext run --input ${WZ_PATHS[f]}${k!=="auto（自动判定）"?" --kind "+k:""}${document.getElementById("wz-ep").value?" --endpoint "+document.getElementById("wz-ep").value:""}${document.getElementById("wz-h").value?' --hint "'+document.getElementById("wz-h").value+'"':""}')">run --input</button>`;
}

/* ---------- 进度条 ---------- */
function tickProg(){
 const c=C();const now=new Date();const clock=now.toTimeString().slice(0,8);
 const b=c.budget,run=c.active_run;
 document.getElementById("prog").textContent=`${clock}  ${c.id}  ${c.state}  calls ${b.calls.spent}/${b.calls.total}  tokens ${b.tokens.spent}/${b.tokens.total}  ${run?run.mode+" "+run.state:"idle"}`;
}
function toggleProg(){progOn=!progOn;document.getElementById("prog").classList.toggle("on",progOn);if(progOn){tickProg();progTimer=setInterval(tickProg,5000)}else clearInterval(progTimer)}
if(progOn)progTimer=setInterval(tickProg,5000);

/* ---------- render all ---------- */
function renderAll(){renderCamps();renderKali();renderProviders();renderHead();renderCenter();renderRight();tickProg()}
renderAll();

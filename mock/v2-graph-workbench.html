<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RioNext v2 证据图谱</title>
<style>
:root{--bg:#f7f5f0;--card:#ffffff;--ink:#26221a;--dim:#8a8272;--line:#e2dccd;--accent:#b45309;--blue:#1d4ed8;--green:#166534;--red:#b91c1c;--purple:#6d28d9;--mono:"IBM Plex Mono","Cascadia Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5}
button{font:inherit;background:var(--ink);color:#fff;border:0;padding:6px 12px;cursor:pointer;border-radius:3px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button.sm{padding:2px 8px;font-size:11px}
button.warn{background:var(--red)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;background:#fff;border:1px solid var(--line);padding:6px 8px;border-radius:3px;width:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card)}
header .logo{font-weight:600;font-size:14px}
header .logo em{font-style:normal;color:var(--accent)}
header .sub{color:var(--dim);font-size:11px}
.viewtabs{display:flex;gap:2px;margin-left:16px}
.viewtabs .v{padding:6px 14px;cursor:pointer;color:var(--dim);border-radius:3px 3px 0 0;border:1px solid transparent}
.viewtabs .v.on{color:var(--ink);border-color:var(--line);border-bottom-color:var(--card);background:var(--bg)}
header .spacer{flex:1}
.chip{border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:11px;color:var(--dim);background:#fff}
main{display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 45px)}
.graphpane{position:relative;border-right:1px solid var(--line);overflow:hidden}
.graphpane svg{display:block;width:100%;height:calc(100vh - 45px)}
.inspector{padding:14px 16px;overflow-y:auto;max-height:calc(100vh - 45px)}
.inspector h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:12px}
.kv .k{color:var(--dim);flex-shrink:0}
.kv .v{text-align:right;word-break:break-all}
.mini{font-size:11px;color:var(--dim)}
.badge{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--dim);background:#fff}
.badge.b-running{color:var(--green);border-color:#bbf7d0;background:#f0fdf4}
.badge.b-awaiting_verify{color:var(--accent);border-color:#fde68a;background:#fffbeb}
.badge.b-resolved,.badge.b-achieved{color:var(--green);border-color:#bbf7d0}
.badge.b-blocked,.badge.b-disputed{color:var(--red);border-color:#fecaca;background:#fef2f2}
.badge.b-pending{color:var(--accent);border-color:#fde68a;background:#fffbeb}
.legend{position:absolute;left:14px;bottom:14px;background:#fffc;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:11px;backdrop-filter:blur(2px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.toolbar{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.toolbar select{width:auto}
svg text{font-family:var(--mono);font-size:10px;fill:var(--ink)}
.edge{stroke:#c9c2b0;fill:none;stroke-width:1.3}
.edge.sel{stroke:var(--accent);stroke-width:2}
.node{cursor:pointer}
.node rect{stroke:#b9b19d;stroke-width:1.2}
.node.sel rect{stroke:var(--accent);stroke-width:2.2}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:400}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.modal-mask{position:fixed;inset:0;background:#26221a66;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 20px}
.modal-mask.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:8px;width:720px;max-width:100%;padding:18px 22px}
.modal h2{margin:0 0 6px;font-size:14px}
.modal .close{float:right;cursor:pointer;color:var(--dim)}
pre{white-space:pre-wrap;word-break:break-all;background:#f1eee6;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:11px;margin:8px 0;max-height:340px;overflow:auto}
.toast{position:fixed;bottom:18px;right:18px;z-index:99;display:none;max-width:600px;background:var(--card);border:1px solid var(--ink);border-radius:6px;box-shadow:0 6px 24px #0002}
.toast .cap{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;font-size:10px;color:var(--dim);border-bottom:1px solid var(--line)}
.toast pre{border:0;margin:0;max-height:200px}
.palette{position:fixed;inset:0;background:#26221a55;display:none;align-items:flex-start;justify-content:center;z-index:60;padding-top:12vh}
.palette.open{display:flex}
.palette .box{background:var(--card);border:1px solid var(--line);border-radius:8px;width:640px;max-width:92vw;overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px}
.palette .list{max-height:46vh;overflow:auto}
.palette .item{padding:7px 14px;cursor:pointer;font-size:12px}
.palette .item:hover,.palette .item.on{background:#f1eee6}
.palette .item .g{color:var(--dim);font-size:10px;margin-left:8px}
.timeline{padding:16px}
.lane{display:flex;align-items:center;gap:8px;margin:8px 0}
.lane .name{width:110px;font-size:11px;color:var(--dim);flex-shrink:0;text-align:right}
.lane .track{flex:1;position:relative;height:34px;background:#efece3;border-radius:4px}
.bar{position:absolute;height:100%;border-radius:4px;font-size:10px;display:flex;align-items:center;padding:0 6px;overflow:hidden;cursor:pointer;border:1px solid #00000012;white-space:nowrap}
.bar.m{background:#dbeafe;border-color:#93c5fd}
.bar.t{background:#dcfce7;border-color:#86efac}
.bar.unc{background:#fee2e2;border-color:#fca5a5;border-style:dashed}
.bar.fin{background:#fef3c7;border-color:#fcd34d}
.ticks{display:flex;margin-left:118px;font-size:10px;color:var(--dim)}
.ticks span{flex:1;border-left:1px solid var(--line);padding-left:4px}
.matrix .cell{width:22px;height:22px;border-radius:3px;display:inline-block;margin:1px;cursor:default}
.matrix .lg{font-size:11px;color:var(--dim);margin-top:6px}
.matrix .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:10px}
.campsel{max-width:280px}
</style>
</head>

/* ================= 图谱 ================= */
function buildGraph(){
 const c=C();const es=c.entities;
 const rows={goal:[],step:[],obs:[],fact:[],finding:[]};
 es.forEach(e=>rows[e.t].push(e));
 const W=1100,colH=92;const layout=[];let y=60;
 const cols=[["goal",260,"目标"],["step",330,"step"],["obs",430,"观察"],["fact",330,"事实"],["finding",260,"发现"]];
 const pos={};
 cols.forEach(([t,w],ci)=>{
  const arr=rows[t];const x=70+ci*(w+40);
  arr.forEach((e,i)=>{pos[e.id]={x:x+w/2,y:y+i*colH+26};});
  y=Math.max(y,arr.length*colH+40);
 });
 // 分层：每列独立高度，从上往下排
 let maxH=0;
 cols.forEach(([t,w])=>{rows[t].forEach((e,i)=>{pos[e.id]={y:60+i*colH+26,x:0}});maxH=Math.max(maxH,rows[t].length*colH+60)});
 const totalW=cols.reduce((a,[,w])=>a+w+46,0);
 const scale=Math.min(1.15,(W-40)/Math.max(totalW,700));
 let x=50;const centers={};
 cols.forEach(([t,w])=>{rows[t].forEach((e,i)=>{centers[e.id]={x:x+w/2,y:60+i*colH+26}});x+=w*scale+36});
 const edges=[];
 const byId=Object.fromEntries(es.map(e=>[e.id,e]));
 // goal → step
 es.filter(e=>e.t==="step").forEach(s=>{const g=es.find(e=>e.t==="goal");edges.push([g.id,s.id,"belongs"])});
 // step → obs（producer）
 es.filter(e=>e.t==="obs").forEach(o=>{const p=(o.full.producer||"").replace("（第 1 次尝试）","").trim();if(byId[p])edges.push([p,o.id,"produced"])});
 // obs → fact（support）
 es.filter(e=>e.t==="fact").forEach(f=>{(f.full.support||[]).forEach(r=>{if(byId[r])edges.push([r,f.id,"supports"])})});
 // fact/obs → finding（evidence）
 es.filter(e=>e.t==="finding").forEach(f=>{(f.full.evidence||[]).forEach(r=>{if(byId[r])edges.push([r,f.id,"evidence"])})});
 // step → fact（reopen / 产出 fact_key）
 es.filter(e=>e.t==="step"&&e.full.reopen_rule&&e.full.reopen_rule.startsWith("fact_key:")).forEach(s=>{
  const key=e=>e.full&&e.full.fact_key===e.full.reopen_rule;const k=s.full.reopen_rule.slice(9);
  const tgt=es.find(e=>e.t==="fact"&&e.full.fact_key===k);if(tgt)edges.push([tgt.id,s.id,"reopens"])});
 return {cols,rows,centers,edges,byId,totalW,maxH:Math.max(...Object.values(centers).map(p=>p.y))+70};
}
function renderGraph(){
 const g=buildGraph();const W=1100,H=Math.max(g.maxH,420);
 let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet">`;
 // 列标题
 let x=50;g.cols.forEach(([t,w])=>{svg+=`<text x="${x+w/2}" y="34" text-anchor="middle" style="fill:#8a8272;letter-spacing:.18em">${({goal:"目标",step:"STEP",obs:"观察",fact:"事实",finding:"发现"})[t]}</text>`;x+=w*scale0(g)+36});
 // 列底色
 x=50;g.cols.forEach(([t,w])=>{svg+=`<rect x="${x-14}" y="46" width="${w+28}" height="${H-60}" rx="10" fill="${t==="goal"?"#faf5ff":t==="step"?"#eff6ff":t==="obs"?"#f0fdfa":t==="fact"?"#fffbeb":"#fff1f2"}" stroke="#e2dccd"/>`;x+=w*scale0(g)+36});
 // 边
 g.edges.forEach(([a,b,lbl])=>{
  const A=g.centers[a],B=g.centers[b];if(!A||!B)return;
  const sx=A.x+ (a.startsWith("goal")?70: a.startsWith("step")?84:56), ex=B.x-56;
  const mid=(A.x+B.x)/2;
  const selCls=(selEdge===a+"|"+b)?"edge sel":"edge";
  svg+=`<path class="${selCls}" data-e="${a}|${b}" d="M ${sx} ${A.y} C ${mid} ${A.y}, ${mid} ${B.y}, ${ex} ${B.y}"/>
  <circle cx="${ex}" cy="${B.y}" r="3" fill="#c9c2b0"/>`;
 });
 // 节点
 g.cols.forEach(([t,w])=>{
  g.rows[t].forEach(e=>{
   const p=g.centers[e.id];const h=52;const bw=w;
   const ring={resolved:"#166534",running:"#1d4ed8",ready:"#8a8272",blocked:"#b91c1c",accepted:"#166534",disputed:"#b91c1c",pending:"#b45309",achieved:"#166534",active:"#1d4ed8",confirmed:"#166534",suspected:"#b45309",validating:"#b45309",recorded:"#0f766e"}[e.st]||"#8a8272";
   const selCls=selNode===e.id?"sel":"";
   svg+=`<g class="node ${selCls}" data-n="${e.id}" transform="translate(${p.x-bw/2},${p.y-h/2})">
    <rect width="${bw}" height="${h}" rx="8" fill="#fff"/>
    <circle cx="14" cy="${h/2}" r="5" fill="${ring}"/>
    <text x="28" y="20" font-size="11">${esc(trunc(e.label, Math.floor((bw-70)/6.4)))}</text>
    <text x="28" y="38" style="fill:#8a8272">${esc(trunc(e.sub, Math.floor((bw-70)/5.4)))}</text>
   </g>`;
  });
 });
 svg+=`</svg>`;
 const c=C();
 $("graphpane").innerHTML=svg+`
  <div class="legend">
   <div><i style="background:#6d28d9"></i>目标 <i style="background:#1d4ed8"></i>step <i style="background:#0f766e"></i>观察 <i style="background:#b45309"></i>事实 <i style="background:#be123c"></i>发现</div>
   <div class="mini mt">实线：belongs / produced / supports / evidence / reopens · 节点色点=状态 · 点击看右侧全量字段</div>
  </div>
  <div style="position:absolute;left:14px;top:14px" class="flex">
   <button class="ghost sm" onclick="toast('rionext status ${camp} --json')">status</button>
   <button class="ghost sm" onclick="toast('rionext events ${camp} --json')">events</button>
   ${c.pending?`<button class="sm" onclick="verifyFlow()">⏳ 人审候选 flag</button>`:""}
  </div>`;
 // 绑定点击
 document.querySelectorAll("#graphpane .node").forEach(n=>{
  n.addEventListener("click",()=>{selNode=n.dataset.n;selEdge=null;renderGraph();renderInspector()});
 });
 document.querySelectorAll("#graphpane .edge").forEach(p=>{
  p.addEventListener("click",()=>{selEdge=p.dataset.e;renderGraph()});
 });
 // scale helper
 function scale0(g){return Math.min(1.15,(W-40)/Math.max(g.totalW,700))}
}
function trunc(s,n){s=String(s??"");return s.length>n?s.slice(0,n)+"…":s}

  "coverage_policy": { "dimensions": ["asset","method"], "mandatory_ids": ["http-probe"] },
  "artifact_policy": { "max_bytes": 2000000, "retention_days": 7 },
  "stop_policy": { "max_empty_reviews_per_progress_epoch": 6, "decide_debounce_ms": 0 },
  "environment_revision": "env-1"
}`;
 $("graphpane").innerHTML=`<div class="timeline">
  <div class="flex" style="margin-bottom:8px"><b>spec 检视器</b><span class="mini">run 时由 validateCampaignSpec 校验；下面同时看限额与白名单。</span></div>
  <pre>${esc(spec)}</pre>
  <div class="flex">
   ${c.triage?`<button class="ghost sm" onclick="showTriage()">triage 证据</button>`:""}
   <button class="ghost sm" onclick="showWhitelist()">Kali 白名单（按题型）</button>
   <button class="ghost sm" onclick="showLimits()">容器与出口限额</button>
   <button class="ghost sm" onclick="showValidate()">校验错误示例</button>
  </div>
  <div class="panel mt"><h3>运行参数</h3>
   <div class="kv"><span class="k">max-execute-turns / max-tool-calls</span><span>72 / 144（默认）</span></div>
   <div class="kv"><span class="k">max-cycles</span><span>1000（控制器循环）</span></div>
   <div class="kv"><span class="k">progress-ms</span><span>300000（0 关闭）</span></div>
   <div class="kv"><span class="k">finalization</span><span>开（--no-finalization / RIONEXT_FINALIZATION=0 关）</span></div>
   <div class="kv"><span class="k">lease</span><span>Execute 租约 60 分钟 · 心跳 20s</span></div>
  </div></div>`;
}
function showTriage(){const t=C().triage;if(!t){toast("# 该战役不是 --input 起的，没有 triage 记录；run --input 后 spec.challenge 才带 triage 证据","说明");return}
 openModal(`<h2>triage · ${t.kind}/${t.overlay} · ${t.confidence}</h2>
 <div class="mini">seed ${t.seed} → skill ${t.seed}.txt</div>
 ${t.evidence.map(e=>`<div class="kv"><span class="k">${e[0]}</span><span>${esc(e[1])}（权重 ${e[2]}）</span></div>`).join("")}
 <div class="mini mt">manifest：${t.evidence.length} 条证据 · input/original 只读 · 总 sha256 标识输入集，同输入重跑续同 id</div>`)}
function showWhitelist(){openModal(`<h2>Kali 白名单 · 按题型</h2>
 <div class="mini">web：BASE + WEB（nmap curl gobuster ffuf nikto sqlmap nuclei katana httpx-toolkit…）</div>
 <div class="mini">reverse / pwn：BASE + CTF_BASE（xxd strings 7z ctf-python）+ BINARY（gdb r2 checksec ROPgadget qemu gcc nc…）</div>
 <div class="mini">misc：BASE + CTF_BASE + MISC（binwalk foremost exiftool steghide zsteg ffmpeg tshark…）</div>
 <div class="mini">crypto：BASE + CTF_BASE + CRYPTO（openssl john hashcat bkcrack gp）</div>
 <div class="mini">generic：全集 + curl/wget；web 额外放行 impacket- 前缀</div>
 <div class="mini mt">解释器 bash/sh/python3 可 -c 或跑 /workspace 脚本；curl 参数禁止 ; | & $ 等元字符；nmap/nuclei/katana/gobuster/ffuf/sqlmap 等扫描自动后台化。</div>`)}
function showLimits(){openModal(`<h2>容器与出口限额</h2>
 <div class="kv"><span class="k">memory / cpus / pids</span><span>4g / 2 / 512</span></div>
 <div class="kv"><span class="k">单次输出 / 运行时长</span><span>1MB / 60s（后台扫描 60min）</span></div>
 <div class="kv"><span class="k">workspace 容量</span><span>512MB</span></div>
 <div class="kv"><span class="k">出口速率</span><span>20 次/分钟/目标</span></div>
 <div class="kv"><span class="k">出口白名单</span><span>scope.assets 按解析 IP 用 iptables 放行；loopback 拒绝</span></div>
 <div class="kv"><span class="k">cap</span><span>drop ALL，仅 NET_RAW / NET_BIND_SERVICE；no-new-privileges</span></div>`)}
function showValidate(){openModal(`<h2>spec 校验错误示例（validateCampaignSpec）</h2>
 <div class="kv"><span class="k">missing_budget</span><span>budget 至少要有 max_calls / max_tokens / max_cost_micro 之一</span></div>
 <div class="kv"><span class="k">run_source_conflict</span><span>--url 和 --spec 不能同用；--input 与两者都互斥</span></div>
 <div class="kv"><span class="k">invalid_kind</span><span>--kind web 只能配 --url；附件题不允许 kind=web</span></div>
 <div class="kv"><span class="k">unknown_model</span><span>model_policy.provider 必须是 prv_…，model 必须在 catalog</span></div>
 <div class="kv"><span class="k">solver_missing</span><span>未设 solver 槽时 run --url 直接拒绝</span></div>
 <div class="kv"><span class="k">campaign_exists</span><span>同 id 已存在则 run 改为续跑，create 才报冲突</span></div>`)}

/* ================= 命令面板 ================= */
let palSel=0;
function openPalette(){$("palette").classList.add("open");$("pal-q").value="";palSel=0;renderPal();$("pal-q").focus()}
function closePalette(){$("palette").classList.remove("open")}
$("palette").addEventListener("click",e=>{if(e.target.id==="palette")closePalette()});
function renderPal(){
 const q=$("pal-q").value.trim().toLowerCase();
 const items=COMMANDS.filter(c=>!q||(c[0]+c[1]+c[2]).toLowerCase().includes(q));
 $("pal-list").innerHTML=items.map((c,i)=>`<div class="item ${i===palSel?"on":""}" onclick="toast('rionext ${esc(c[0])}');closePalette()"><b>rionext ${esc(c[0])}</b><span class="g">${c[1]}</span><div class="mini">${esc(c[2])}</div></div>`).join("")||'<div class="item mini">没有匹配命令</div>';
}
document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette()}
 if($("palette").classList.contains("open")){
  const items=COMMANDS.filter(c=>!$("pal-q").value.trim()||(c[0]+c[1]+c[2]).toLowerCase().includes($("pal-q").value.trim().toLowerCase()));
  if(e.key==="Escape")closePalette();
  if(e.key==="ArrowDown"){palSel=Math.min(palSel+1,items.length-1);renderPal();e.preventDefault()}
  if(e.key==="ArrowUp"){palSel=Math.max(palSel-1,0);renderPal();e.preventDefault()}
  if(e.key==="Enter"&&items[palSel]){toast("rionext "+items[palSel][0]);closePalette();e.preventDefault()}
 }
});

/* ================= 视图分发 ================= */
function renderView(){
 if(view==="graph")renderGraph();
 else if(view==="timeline")renderTimeline();
 else if(view==="matrix")renderMatrix();
 else renderSpec();
}
renderHeader();renderView();renderInspector();

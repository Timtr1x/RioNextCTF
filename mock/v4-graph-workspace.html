<style>
:root{--bg:#f7f5f0;--card:#ffffff;--ink:#26221a;--dim:#8a8272;--line:#e2dccd;--panel:#f1eee6;--accent:#b45309;--blue:#1d4ed8;--green:#166534;--red:#b91c1c;--purple:#6d28d9;--mono:"IBM Plex Mono","Cascadia Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5}
h1,h2,h3,h4{font-weight:500;margin:0}
button{font:inherit;background:var(--ink);color:#fff;border:0;padding:6px 12px;cursor:pointer;border-radius:3px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button.sm{padding:2px 8px;font-size:11px}
button.danger{background:var(--red)}
button.acc{background:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;background:#fff;border:1px solid var(--line);padding:6px 8px;border-radius:3px;width:100%}
.shell{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
aside{background:#efece3;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{padding:4px 8px 14px;font-size:14px}
aside .brand em{font-style:normal;color:var(--accent)}
aside nav a{display:flex;justify-content:space-between;align-items:center;color:#5c5546;text-decoration:none;padding:7px 10px;border-radius:4px;margin:2px 0;cursor:pointer}
aside nav a:hover{background:#e6e1d4}
aside nav a.on{background:var(--ink);color:#f7f5f0}
aside nav .cnt{background:var(--accent);color:#fff;border-radius:9px;font-size:10px;padding:0 7px}
aside .foot{margin-top:16px;padding:8px 10px;font-size:10px;color:var(--dim);border-top:1px solid var(--line)}
main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.top .crumb{font-size:12px;color:var(--dim)}
.top .spacer,.spacer{flex:1}
.chip{border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:11px;color:var(--dim);background:#fff}
.page{padding:18px 22px 60px;max-width:1400px}
.badge{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--dim);background:#fff}
.badge.b-active{color:var(--green);border-color:#bbf7d0;background:#f0fdf4}
.badge.b-running{color:var(--blue);border-color:#bfdbfe}
.badge.b-awaiting_verify{color:var(--accent);border-color:#fde68a;background:#fffbeb}
.badge.b-budget_paused{color:var(--blue);border-color:#bfdbfe;background:#eff6ff}
.badge.b-blocked,.badge.b-disputed{color:var(--red);border-color:#fecaca;background:#fef2f2}
.badge.b-cancelled{color:var(--dim);text-decoration:line-through}
.badge.b-completed,.badge.b-resolved,.badge.b-achieved{color:var(--green);border-color:#bbf7d0;background:#f0fdf4}
.badge.b-pending{color:var(--accent);border-color:#fde68a;background:#fffbeb}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--dim);background:#fff}
.tag.ok{color:var(--green);border-color:#9ae6b4;background:#f0fdf4}
.tag.warn{color:var(--accent);border-color:#fde68a;background:#fffbeb}
.tag.bad{color:var(--red);border-color:#fecaca;background:#fef2f2}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.ccard:hover{border-color:var(--accent)}
.ccard .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .id{font-weight:600;font-size:12px}
.ccard .meta{font-size:11px;color:var(--dim);margin-top:3px}
.progress{height:6px;border-radius:3px;background:var(--panel);overflow:hidden;margin-top:6px;display:flex}
.progress i{display:block;height:100%;background:var(--accent)}
.progress i.t{background:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.card h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:12px}
.kv .k{color:var(--dim);flex-shrink:0}
.kv .v{text-align:right;word-break:break-all}
.mini{font-size:11px;color:var(--dim)}
.banner{display:flex;align-items:center;gap:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:10px 14px;margin-bottom:12px}
.banner.blue{background:#eff6ff;border-color:#bfdbfe}
.banner .t{font-weight:600;font-size:12px}
.banner .code{font-size:12px;color:#744210;word-break:break-all}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:2fr 1fr}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:400}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover{background:#faf8f3}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 12px}
.tabs .t{padding:6px 12px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;font-size:12px}
.tabs .t.on{color:var(--accent);border-color:var(--accent)}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:230px;flex:1;background:#efece3;border-radius:6px;padding:9px}
.kcol h4{font-size:11px;color:var(--dim);margin:0 0 7px;display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.kcard:hover{border-color:var(--accent)}
.kcard .t{font-weight:600;font-size:12px}
.kcard .m{font-size:10px;color:var(--dim);margin-top:3px}
.donut{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
.donut b{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px dashed #b9b19d;border-radius:4px;padding:5px 9px;font-size:11px;margin-bottom:6px;background:#fff}
.slot select{width:170px}
.logbox{background:#1a202c;color:#a0aec0;border-radius:6px;padding:10px;font-size:11px;height:170px;overflow:auto}
.logbox .ok{color:#68d391}
.logbox .err{color:#fc8181}
.modal-mask{position:fixed;inset:0;background:#26221a55;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:5vh 20px}
.modal-mask.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:8px;width:760px;max-width:100%;padding:18px 22px}
.modal h2{font-size:14px;margin-bottom:6px}
.modal .close{float:right;cursor:pointer;color:var(--dim)}
.steps-ind{display:flex;gap:6px;margin-bottom:14px}
.steps-ind span{flex:1;text-align:center;font-size:12px;color:var(--dim);padding-bottom:6px;border-bottom:3px solid var(--line)}
.steps-ind span.on{color:var(--accent);border-color:var(--accent)}
pre{white-space:pre-wrap;word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:11px;margin:8px 0;max-height:320px;overflow:auto}
.frow{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:7px 0}
.frow label{color:var(--dim);font-size:11px}
.evi{font-size:11px;color:#4a5568;padding:2px 0 2px 10px;border-left:2px solid var(--line);margin:3px 0}
.toast{position:fixed;bottom:18px;right:18px;z-index:99;display:none;max-width:600px;background:var(--card);border:1px solid var(--ink);border-radius:6px;box-shadow:0 6px 24px #0002}
.toast .cap{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;font-size:10px;color:var(--dim);border-bottom:1px solid var(--line)}
.toast pre{border:0;margin:0;max-height:200px;background:transparent}

.palette.open{display:flex}
.palette .box{background:var(--card);border:1px solid var(--line);border-radius:8px;width:640px;max-width:92vw;overflow:hidden}

.palette .list{max-height:46vh;overflow:auto}
.palette .item{padding:7px 14px;cursor:pointer;font-size:12px}
.palette .item:hover,.palette .item.on{background:var(--panel)}
.palette .item .g{color:var(--dim);font-size:10px;margin-left:8px}

.detail-wrap.solo{grid-template-columns:1fr}
.detail-pane{position:relative;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:420px;overflow:hidden}
.inspector-col{padding:0 0 0 14px;max-height:calc(100vh - 120px);overflow-y:auto}
.inspector-col h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.inspector-col .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.inspector-col .panel h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.legend{position:absolute;left:12px;bottom:12px;background:#fffc;border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:11px;backdrop-filter:blur(2px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.detail-pane svg{display:block;width:100%}
svg text{font-family:var(--mono);font-size:10px;fill:var(--ink)}
.edge{stroke:#c9c2b0;fill:none;stroke-width:1.3}
.edge.sel{stroke:var(--accent);stroke-width:2}
.node{cursor:pointer}
.node rect{stroke:#b9b19d;stroke-width:1.2}
.node.sel rect{stroke:var(--accent);stroke-width:2.2}
.timeline{padding:14px}
.lane{display:flex;align-items:center;gap:8px;margin:7px 0}
.lane .name{width:100px;font-size:11px;color:var(--dim);flex-shrink:0;text-align:right}
.lane .track{flex:1;position:relative;height:32px;background:#efece3;border-radius:4px}
.bar{position:absolute;height:100%;border-radius:4px;font-size:10px;display:flex;align-items:center;padding:0 6px;overflow:hidden;cursor:pointer;border:1px solid #00000012;white-space:nowrap}
.bar.m{background:#dbeafe;border-color:#93c5fd}
.bar.t{background:#dcfce7;border-color:#86efac}
.bar.unc{background:#fee2e2;border-color:#fca5a5;border-style:dashed}
.bar.fin{background:#fef3c7;border-color:#fcd34d}
.ticks{display:flex;margin-left:108px;font-size:10px;color:var(--dim)}
.ticks span{flex:1;border-left:1px solid var(--line);padding-left:4px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:10px}
.pct-row{display:flex;gap:10px;align-items:baseline;margin:3px 0}
.pct-row .n{font-size:18px}
.pct-row .d{font-size:10px;color:var(--dim)}
.gauge{margin:5px 0}
.gauge .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.gauge .bar2{height:7px;background:var(--panel);border:1px solid var(--line);margin-top:3px;border-radius:3px;overflow:hidden;display:flex}
.gauge .bar2 i{height:100%;background:var(--accent)}
</style>

/* ---------- 图谱（v2 原样搬入，渲染目标改为传入元素） ---------- */
function buildGraph(){
 const c=C();const es=c.entities;
 const rows={goal:[],step:[],obs:[],fact:[],finding:[]};
 es.forEach(e=>rows[e.t].push(e));
 const cols=[["goal",260],["step",330],["obs",430],["fact",330],["finding",260]];
 const byId=Object.fromEntries(es.map(e=>[e.id,e]));
 const centers={};
 const W=1100;let x=50;const scale=Math.min(1.15,(W-40)/Math.max(cols.reduce((a,[,w])=>a+w+46,0),700));
 cols.forEach(([t,w])=>{rows[t].forEach((e,i)=>{centers[e.id]={x:x+w*scale/2,y:60+i*92+26}});x+=w*scale+36});
 const edges=[];
 es.filter(e=>e.t==="step").forEach(s=>{const g=es.find(e=>e.t==="goal");edges.push([g.id,s.id])});
 es.filter(e=>e.t==="obs").forEach(o=>{const p=(o.full.producer||"").trim();if(byId[p])edges.push([p,o.id])});
 es.filter(e=>e.t==="fact").forEach(f=>{(f.full.support||[]).forEach(r=>{if(byId[r])edges.push([r,f.id])})});
 es.filter(e=>e.t==="finding").forEach(f=>{(f.full.evidence||[]).forEach(r=>{if(byId[r])edges.push([r,f.id])})});
 es.filter(e=>e.t==="step"&&e.full.reopen_rule&&String(e.full.reopen_rule).startsWith("fact_key:")).forEach(s=>{
  const k=String(s.full.reopen_rule).slice(9);const tgt=es.find(e=>e.t==="fact"&&e.full.fact_key===k);if(tgt)edges.push([tgt.id,s.id])});
 return {cols,rows,centers,edges,byId,scale,maxH:Math.max(420,...Object.values(centers).map(p=>p.y+60))};
}
function renderGraphInto(pane){
 if(!pane)return;
 const g=buildGraph();const W=1100,H=g.maxH;
 let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet">`;
 let x=50;g.cols.forEach(([t,w])=>{svg+=`<text x="${x+w*g.scale/2}" y="30" text-anchor="middle" style="fill:#8a8272;letter-spacing:.18em">${({goal:"目标",step:"STEP",obs:"观察",fact:"事实",finding:"发现"})[t]}</text>`;
  svg+=`<rect x="${x-12}" y="42" width="${w*g.scale+24}" height="${H-54}" rx="8" fill="${t==="goal"?"#faf5ff":t==="step"?"#eff6ff":t==="obs"?"#f0fdfa":t==="fact"?"#fffbeb":"#fff1f2"}" stroke="#e2dccd"/>`;x+=w*g.scale+36});
 g.edges.forEach(([a,b])=>{
  const A=g.centers[a],B=g.centers[b];if(!A||!B)return;
  const sx=A.x+(a.startsWith("goal")?60:a.startsWith("step")?76:50),ex=B.x-50;
  svg+=`<path class="edge ${selEdge===a+"|"+b?"sel":""}" data-e="${a}|${b}" d="M ${sx} ${A.y} C ${(A.x+B.x)/2} ${A.y}, ${(A.x+B.x)/2} ${B.y}, ${ex} ${B.y}"/>`;
 });
 g.cols.forEach(([t,w])=>{
  g.rows[t].forEach(e=>{
   const p=g.centers[e.id];const h=52,bw=w*g.scale;
   const ring={resolved:"#166534",running:"#1d4ed8",ready:"#8a8272",blocked:"#b91c1c",accepted:"#166534",disputed:"#b91c1c",pending:"#b45309",achieved:"#166534",active:"#1d4ed8",confirmed:"#166534",suspected:"#b45309",validating:"#b45309",recorded:"#0f766e"}[e.st]||"#8a8272";
   svg+=`<g class="node ${selNode===e.id?"sel":""}" data-n="${e.id}" transform="translate(${p.x-bw/2},${p.y-h/2})">
    <rect width="${bw}" height="${h}" rx="7" fill="#fff"/>
    <circle cx="13" cy="${h/2}" r="4.5" fill="${ring}"/>
    <text x="26" y="20" font-size="11">${esc(trunc(e.label,Math.floor((bw-64)/6.4)))}</text>
    <text x="26" y="37" style="fill:#8a8272">${esc(trunc(e.sub,Math.floor((bw-64)/5.4)))}</text></g>`;
  });
 });
 svg+=`</svg>`;
 pane.innerHTML=svg+`
  <div class="legend"><div><i style="background:#6d28d9"></i>目标 <i style="background:#1d4ed8"></i>step <i style="background:#0f766e"></i>观察 <i style="background:#b45309"></i>事实 <i style="background:#be123c"></i>发现</div>
  <div class="mini mt">边：belongs / produced / supports / evidence / reopens · 点节点看 provenance</div></div>
  <div style="position:absolute;right:12px;top:12px" class="flex">
   <button class="ghost sm" onclick="toast('rionext status ${camp} --json')">status</button>
   <button class="ghost sm" onclick="toast('rionext events ${camp} --json')">events</button>
  </div>`;
 pane.querySelectorAll(".node").forEach(n=>n.addEventListener("click",()=>{selNode=n.dataset.n;selEdge=null;renderGraphInto($("detail-pane"));renderInspector()}));
 pane.querySelectorAll(".edge").forEach(p=>p.addEventListener("click",()=>{selEdge=p.dataset.e;renderGraphInto($("detail-pane"))}));
}

/* ================= 命令面板（v2 原样） ================= */
let palSel=0;
function openPalette(){$("palette").classList.add("open");$("pal-q").value="";palSel=0;renderPal();$("pal-q").focus()}
function closePalette(){$("palette").classList.remove("open")}
$("palette").addEventListener("click",e=>{if(e.target.id==="palette")closePalette()});
function renderPal(){
 const q=$("pal-q").value.trim().toLowerCase();
 const items=COMMANDS.filter(c=>!q||(c[0]+c[1]+c[2]).toLowerCase().includes(q));
 $("pal-list").innerHTML=items.map((c,i)=>`<div class="item ${i===palSel?"on":""}" onclick="toast('rionext ${esc(c[0])}');closePalette()"><b>rionext ${esc(c[0])}</b><span class="g">${c[1]}</span><div class="mini">${esc(c[2])}</div></div>`).join("")||'<div class="item mini">没有匹配命令</div>';
}
document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette()}
 if($("palette").classList.contains("open")){
  const q=$("pal-q").value.trim().toLowerCase();
  const items=COMMANDS.filter(c=>!q||(c[0]+c[1]+c[2]).toLowerCase().includes(q));
  if(e.key==="Escape")closePalette();
  if(e.key==="ArrowDown"){palSel=Math.min(palSel+1,Math.max(items.length-1,0));renderPal();e.preventDefault()}
  if(e.key==="ArrowUp"){palSel=Math.max(palSel-1,0);renderPal();e.preventDefault()}
  if(e.key==="Enter"&&items[palSel]){toast("rionext "+items[palSel][0]);closePalette();e.preventDefault()}
 }
});
